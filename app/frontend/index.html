<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Song of the Day</title>
    <style>
      :root{
        --glass-bg: rgba(255,255,255,0.12);
        --glass-border: rgba(255,255,255,0.25);
        --glass-shadow: rgba(0,0,0,0.25);
      }
      html,body,#root{height:100%}
      body{
        margin:0; background:#0b0f14; color:#eef1f5;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Noto Sans, "Apple Color Emoji", "Segoe UI Emoji";
      }
      .glass{
        background: var(--glass-bg);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        box-shadow: 0 10px 30px var(--glass-shadow);
      }
      .btn{ padding:10px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.08); color:#fff; cursor:pointer }
      .btn:disabled{ opacity:.6; cursor:not-allowed }
      a{ color:#a7d3ff }

      /* Animations and hero visuals */
      @keyframes fadeUp { from{ opacity:0; transform: translateY(8px) } to{ opacity:1; transform: translateY(0) } }
      @keyframes float { 0%{ transform: translateY(0) } 50%{ transform: translateY(-6px) } 100%{ transform: translateY(0) } }
      @keyframes glow { 0%{ box-shadow: 0 10px 30px rgba(0,0,0,.35) } 50%{ box-shadow: 0 18px 50px rgba(0,0,0,.55) } 100%{ box-shadow: 0 10px 30px rgba(0,0,0,.35) } }
      .fade-up{ animation: fadeUp .5s ease both }
      .album-hero{ width:min(340px, 70vw); height:min(340px, 70vw); border-radius:24px; overflow:hidden; animation: float 6s ease-in-out infinite, glow 6s ease-in-out infinite }
      .album-hero img{ width:100%; height:100%; object-fit:cover }
      .hero-row{ display:flex; gap:20px; align-items:center; flex-wrap:wrap }
      .title-xl{ font-size: clamp(20px, 3vw, 28px); margin: 4px 0 }
      .subtitle{ opacity:.85; margin:0 }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
