name: Redeploy Song of the Day (Railway)

on:
  workflow_dispatch:
    inputs:
      backend_service_id:
        description: Optional override for Backend Service ID
        required: false
      frontend_service_id:
        description: Optional override for Frontend Service ID
        required: false

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
  RAILWAY_ENV_ID: ${{ secrets.RAILWAY_ENV_ID }}
  BACKEND_SERVICE_ID: ${{ github.event.inputs.backend_service_id != '' && github.event.inputs.backend_service_id || secrets.RAILWAY_BACKEND_SERVICE_ID }}
  FRONTEND_SERVICE_ID: ${{ github.event.inputs.frontend_service_id != '' && github.event.inputs.frontend_service_id || secrets.RAILWAY_FRONTEND_SERVICE_ID }}

jobs:
  redeploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        shell: bash
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Link Railway project & environment
        shell: bash
        env:
          RAILWAY_PROJECT_ID: ${{ env.RAILWAY_PROJECT_ID }}
          RAILWAY_ENV_ID: ${{ env.RAILWAY_ENV_ID }}
        run: |
          set -euo pipefail
          echo "Linking to project $RAILWAY_PROJECT_ID and environment $RAILWAY_ENV_ID"
          railway link --project "$RAILWAY_PROJECT_ID" || true
          if [ -n "${RAILWAY_ENV_ID:-}" ]; then
            railway link --environment "$RAILWAY_ENV_ID" || true
          fi

      - name: Deploy backend (detached)
        id: deploy_backend
        shell: bash
        env:
          BACKEND_SERVICE_ID: ${{ env.BACKEND_SERVICE_ID }}
        run: |
          set -euo pipefail
          echo "Deploying backend to service: $BACKEND_SERVICE_ID"
          railway up --service "$BACKEND_SERVICE_ID" --detach

      - name: Wait for backend health (optional)
        shell: bash
        env:
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_URL:-}" ]; then
            echo "No BACKEND_HEALTH_URL provided; skipping health check."
            exit 0
          fi
          echo "Waiting for backend health at $HEALTH_URL"
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo 000)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy in time." >&2
          exit 1

      - name: Deploy frontend (detached)
        id: deploy_frontend
        shell: bash
        env:
          FRONTEND_SERVICE_ID: ${{ env.FRONTEND_SERVICE_ID }}
        run: |
          set -euo pipefail
          echo "Deploying frontend from app/frontend (context-based)"
          cd app/frontend
          railway up --detach

      - name: Summary
        if: always()
        run: |
          echo "Backend Service ID: $BACKEND_SERVICE_ID"
          echo "Frontend Service ID: $FRONTEND_SERVICE_ID"

